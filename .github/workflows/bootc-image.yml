name: bootc image

on:
  push:
    branches: [main]
    paths:
      - 'images/bento-fedora-bootc/**'
      - '.github/workflows/bootc-image.yml'
  pull_request:
    paths:
      - 'images/bento-fedora-bootc/**'
      - '.github/workflows/bootc-image.yml'
  # A bootc image is a static artifact: nothing updates it in place, so the
  # only way to pick up a Fedora or Claude Code release is to rebuild.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bento-fedora-bootc
  FEDORA_RELEASE: '44'

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # One architecture failing must not hide the result of the other.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # A pull request may come from a fork, which has no package write
      # token. Those runs build and throw the result away.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture pushes an untagged manifest addressed only by its
      # digest. The merge job below collects them under the real tags, so no
      # tag ever points at a half-published image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/bento-fedora-bootc
          file: images/bento-fedora-bootc/Containerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish the manifest list
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `44` is the moving tag an operator names in bento.toml. The
      # sha-suffixed tag exists so a specific build stays addressable after
      # `44` has moved on.
      - name: Compute the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.FEDORA_RELEASE }}
            type=raw,value=${{ env.FEDORA_RELEASE }}-{{sha}}
          labels: |
            org.opencontainers.image.title=bento-fedora-bootc
            org.opencontainers.image.description=Fedora ${{ env.FEDORA_RELEASE }} bootc development image for Bento

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # Prints the digest an operator pins, and proves the list carries both
      # architectures.
      - name: Show the published image
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${FEDORA_RELEASE}"
