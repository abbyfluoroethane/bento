name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace turns a bare panic in the end-to-end suite into something
  # a reader can act on.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing must not hide the result of the other.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel and the components, and
      # rustup honours it. Nothing here may name a toolchain: that would
      # let CI drift away from a local build.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # The end-to-end suite runs the real overlay and seed-ISO steps, so
      # it needs the real binaries (SPEC 4.2, 5.2).
      - name: Install the host binaries the tests shell out to
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes qemu-utils xorriso
          qemu-img --version | head -1
          xorriso --version 2>&1 | head -1

      # `bentod serve` refuses to start when /dev/kvm is absent (SPEC 4.2
      # item 1). The x86_64 runners have the device. The arm64 runners
      # offer no nested virtualization at all, so they get a stub node:
      # the end-to-end tier drives a fake libvirtd and never opens the
      # device, it only checks that the host claims one. A tier that
      # boots real guests cannot run here at all — see TESTING.md.
      - name: Provide /dev/kvm for the host requirement check
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "no KVM on this runner; creating a stub device node"
            sudo mknod /dev/kvm c 10 232
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib --bins

      - name: End-to-end tests
        run: cargo test --package bentod --test e2e -- --nocapture
