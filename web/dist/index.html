    <title>Bento</title>
    <script>
      // Apply the theme before first paint: manual override from
      // localStorage wins, else the OS preference (SPEC 14.2).
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("bento-theme");
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
