[package]
name = "bento-sshfront"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
bento-store = { workspace = true }
bento-types = { workspace = true }
bytes = { workspace = true }
russh = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
time = { workspace = true }
# `test-util` gives the tests a paused clock, so the key-linking wait can be
# exercised over its whole three-minute window without taking three minutes.
tokio = { workspace = true, features = ["test-util"] }
