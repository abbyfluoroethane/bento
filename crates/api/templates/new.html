{% extends "layout.html" %}
{% block content %}
<header class="page"><h1>New VM</h1></header>
{% if error %}
<div class="alert" data-variant="destructive" role="alert">
  <h2>Not created</h2>
  <section><p>{{ error }}</p></section>
</div>
{% endif %}
<form class="form" method="post" action="/new">
  <div class="field">
    <label for="name">VM name</label>
    <div class="name-field">
      <input class="input mono" id="name" name="name" value="{{ form.name }}" placeholder="machine-name" pattern="[a-z0-9]([a-z0-9\-]{0,61}[a-z0-9])?" required autofocus autocomplete="off">
      <span class="suffix">.{{ base_domain }}</span>
    </div>
    <p class="hint">Lower-case letters, digits, and hyphens.</p>
  </div>
  <div class="field">
    <label for="image-select-trigger">Image</label>
    <div id="image-select" class="select mono" data-placeholder="Choose an image">
      <button type="button" id="image-select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="image-select-listbox">
        <span class="truncate">{% if form.image %}{{ form.image }}{% elif images %}{{ images[0] }}{% else %}No images yet{% endif %}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="image-select-popover" data-popover aria-hidden="true">
        <div role="listbox" id="image-select-listbox" aria-orientation="vertical" aria-labelledby="image-select-trigger">
          {% for image in images %}<div role="option" data-value="{{ image }}"{% if image == form.image or (not form.image and loop.first) %} aria-selected="true"{% endif %}>{{ image }}</div>{% endfor %}
        </div>
      </div>
      <input type="hidden" name="image" value="{% if form.image %}{{ form.image }}{% elif images %}{{ images[0] }}{% endif %}">
    </div>
  </div>
  <div class="fields three">
    <div class="stepper">
      <label for="vcpu">vCPU</label>
      <div class="value"><input id="vcpu" name="vcpu" type="number" min="1" max="64" step="1" value="{{ form.vcpu }}" required><span class="unit">vCores</span></div>
      <div class="controls"><button type="button" class="btn" data-variant="ghost" data-size="icon-sm" data-step="down" aria-label="Fewer vCPU">−</button><button type="button" class="btn" data-variant="ghost" data-size="icon-sm" data-step="up" aria-label="More vCPU">+</button></div>
    </div>
    <div class="stepper">
      <label for="memory_gib">Memory</label>
      <div class="value"><input id="memory_gib" name="memory_gib" type="number" min="0.5" max="256" step="0.5" value="{{ form.memory_gib|num }}" required><span class="unit">GiB</span></div>
      <div class="controls"><button type="button" class="btn" data-variant="ghost" data-size="icon-sm" data-step="down" aria-label="Less memory">−</button><button type="button" class="btn" data-variant="ghost" data-size="icon-sm" data-step="up" aria-label="More memory">+</button></div>
    </div>
    <div class="stepper">
      <label for="disk_gib">Storage</label>
      <div class="value"><input id="disk_gib" name="disk_gib" type="number" min="1" max="4096" step="1" value="{{ form.disk_gib }}" required><span class="unit">GiB</span></div>
      <div class="controls"><button type="button" class="btn" data-variant="ghost" data-size="icon-sm" data-step="down" aria-label="Less storage">−</button><button type="button" class="btn" data-variant="ghost" data-size="icon-sm" data-step="up" aria-label="More storage">+</button></div>
    </div>
  </div>
  <div>
    <label class="switch-row" for="public">
      <span class="text"><b>Make VM public</b><span>When enabled, users can visit <span class="mono" data-name-preview>{{ form.name or "machine-name" }}</span>.{{ base_domain }} without authentication.</span></span>
      <input class="input" type="checkbox" role="switch" id="public" name="public"{% if form.public %} checked{% endif %}>
    </label>
    <label class="switch-row" for="ksm">
      <span class="text"><b>KSM / memory deduplication</b><span>Share identical memory pages between VMs. Cannot be changed later.</span></span>
      <input class="input" type="checkbox" role="switch" id="ksm" name="ksm"{% if form.ksm %} checked{% endif %}>
    </label>
    <label class="switch-row" for="nested">
      <span class="text"><b>Nested virtualization</b><span>Run VMs inside this VM.</span></span>
      <input class="input" type="checkbox" role="switch" id="nested" name="nested"{% if form.nested %} checked{% endif %}>
    </label>
  </div>
  <div class="actions">
    <a class="btn" data-variant="ghost" href="/">Cancel</a>
    <button type="submit" class="btn">Create VM</button>
  </div>
</form>
{% endblock %}
