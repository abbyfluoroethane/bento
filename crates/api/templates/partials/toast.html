<div class="toast" role="{% if toast.category == 'error' %}alert{% else %}status{% endif %}" aria-atomic="true" aria-hidden="false" data-category="{{ toast.category }}">
  <div class="toast-content">
    {% if toast.category == 'error' %}<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>{% else %}<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>{% endif %}
    <section><h2>{{ toast.title }}</h2></section>
  </div>
</div>
